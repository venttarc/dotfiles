  theme = "vesper"

[editor]
true-color = true
bufferline = "multiple"
color-modes = true
popup-border = "all"
cursorline = true

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.statusline]
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.indent-guides]
render = true

[keys.normal]
C-r = ":reload"
